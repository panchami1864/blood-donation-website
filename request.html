<!DOCTYPE html>
<html>
<head>
    <title>Emergency Blood Request</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BloodConnect</h1>

    <nav>
        <a href="index1.html">Home</a>
        <a href="register.html">Register Donor</a>
        <a href="donors.html">Find Donor</a>
        <a href="request.html">Emergency Request</a>
    </nav>
</header>

<div class="form-container">

    <h2>Create Emergency Request</h2>

    <form id="requestForm">

        <label>Patient Name</label>
        <input type="text" id="patientName" required>

        <label>Blood Group</label>
        <select id="requiredBlood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label>Required Quantity</label>
        <input type="number" id="quantity" min="1" required>

        <label>Hospital Name</label>
        <input type="text" id="hospitalName" required>

        <label>Location</label>
        <input type="text" id="requestLocation" required>

        <label>Required Date and Time</label>
        <input type="datetime-local" id="requiredDate" required>

        <label>Emergency Description</label>
        <textarea id="description" required></textarea>

        <label>Contact Number</label>
        <input type="tel" id="requestContact" required>

        <button type="submit">Create Request</button>

    </form>

    <p id="requestMessage"></p>

</div>


<div class="container">

    <h2>Active Emergency Requests</h2>

    <div id="requestList" class="card-container"></div>

</div>

<script src="script1.js"></script>

</body>
</html>
