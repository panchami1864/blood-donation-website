<!DOCTYPE html>
<html>
<head>
    <title>Register Donor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BloodConnect</h1>

    <nav>
        <a href="index1.html">Home</a>
        <a href="register.html">Register Donor</a>
        <a href="donors.html">Find Donor</a>
        <a href="request.html">Emergency Request</a>
        </nav>
</header>

<div class="form-container">

    <h2>Donor Registration</h2>

    <form id="donorForm">

        <label>Name</label>
        <input type="text" id="donorName" required>

        <label>Blood Group</label>
        <select id="bloodGroup" required>
            <option value="">Select Blood Group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Phone Number</label>
        <input type="tel" id="donorPhone" required>

        <label>Email</label>
        <input type="email" id="donorEmail">

        <label>Location</label>
        <input type="text" id="donorLocation" required>

        <label>Availability</label>
        <select id="availability" required>
            <option value="">Select Availability</option>
            <option value="Available">Available</option>
            <option value="Not Available">Not Available</option>
        </select>

        <label>Other Information</label>
        <textarea id="otherInfo"></textarea>

        <button type="submit">Register Donor</button>

    </form>

    <p id="donorMessage"></p>

</div>

<script src="script1.js"></script>

</body>
</html>
