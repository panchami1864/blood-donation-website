<!DOCTYPE html>
<html>
<head>
    <title>Find Donor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>BloodConnect</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register Donor</a>
        <a href="donors.html">Find Donor</a>
        <a href="request.html">Emergency Request</a>
    </nav>
</header>

<div class="container">

    <h2>Available Blood Donors</h2>

    <div class="filters">

        <input
            type="text"
            id="searchDonor"
            placeholder="Search by name or location"
        >

        <select id="filterBlood">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <select id="filterAvailability">
            <option value="">All</option>
            <option value="Available">Available</option>
            <option value="Not Available">Not Available</option>
        </select>

    </div>

    <div id="donorList" class="card-container"></div>

</div>

<script src="script.js"></script>

</body>
</html>
